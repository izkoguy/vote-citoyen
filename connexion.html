<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote Citoyen — Connexion</title>
  <meta name="description" content="Connexion au service Vote Citoyen." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="Vote Citoyen — Accueil">
        <span class="logo-icon" aria-hidden="true">V</span>
        Vote Citoyen
      </a>
      <nav class="nav-main" aria-label="Navigation principale">
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="connexion.html">Connexion</a></li>
          <li><a href="vote.html">Vote</a></li>
          <li><a href="resultat.html">Résultat</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="form-card" aria-label="Formulaire de connexion">
      <h2>Se connecter</h2>
      <p class="subtitle">Accédez à votre espace de vote citoyen.</p>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Adresse électronique</label>
          <input type="email" id="email" name="email" placeholder="exemple@domaine.fr" autocomplete="email" required aria-required="true" />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Votre mot de passe" autocomplete="current-password" required aria-required="true" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Se connecter</button>
          <a href="index.html" class="btn btn-secondary">Annuler</a>
        </div>
      </form>
    </section>
  </main>

  <div class="prototype-banner" role="note" aria-label="Avertissement prototype">
    <span>Prototype scolaire — démonstration fictive</span>
  </div>
  <footer class="site-footer" role="contentinfo">
    <p>© Vote Citoyen — Projet statique sans backend.</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
